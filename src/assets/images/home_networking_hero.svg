<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Dark Radial & Linear Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1e2430" />
      <stop offset="60%" stop-color="#0e1117" />
      <stop offset="100%" stop-color="#07080b" />
    </radialGradient>

    <radialGradient id="wifiPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3b30" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#00d2ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="fiberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30" />
      <stop offset="50%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#34c759" />
    </linearGradient>

    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1920" height="1080" fill="url(#bgGlow)" />

  <!-- Subtle Architectural Grid Gridlines -->
  <g stroke="rgba(255, 255, 255, 0.03)" stroke-width="1">
    <line x1="0" y1="180" x2="1920" y2="180" />
    <line x1="0" y1="360" x2="1920" y2="360" />
    <line x1="0" y1="540" x2="1920" y2="540" />
    <line x1="0" y1="720" x2="1920" y2="720" />
    <line x1="0" y1="900" x2="1920" y2="900" />
    <line x1="320" y1="0" x2="320" y2="1080" />
    <line x1="640" y1="0" x2="640" y2="1080" />
    <line x1="960" y1="0" x2="960" y2="1080" />
    <line x1="1280" y1="0" x2="1280" y2="1080" />
    <line x1="1600" y1="0" x2="1600" y2="1080" />
  </g>

  <!-- Main Ambient Wi-Fi 7 Signal Pulse Rings -->
  <circle cx="960" cy="480" r="500" fill="url(#wifiPulse)" />
  
  <g stroke="#00d2ff" stroke-opacity="0.2" stroke-width="1.5" fill="none">
    <circle cx="960" cy="480" r="160" stroke-dasharray="8,6" />
    <circle cx="960" cy="480" r="280" />
    <circle cx="960" cy="480" r="420" stroke-dasharray="12,8" />
    <circle cx="960" cy="480" r="560" />
  </g>

  <!-- Fiber Optic Interconnect Laser Lines -->
  <g stroke="url(#fiberGlow)" stroke-width="2.5" fill="none" filter="url(#softGlow)" opacity="0.85">
    <!-- Main AP to Living Room -->
    <path d="M960,480 L620,320 L380,320" />
    <!-- Main AP to Waterfront Dock -->
    <path d="M960,480 L1340,320 L1620,320" />
    <!-- Main AP to Control4 Hub -->
    <path d="M960,480 L960,780" />
    <!-- Main AP to Outdoor Patio -->
    <path d="M960,480 L520,680 L360,680" />
    <!-- Main AP to Master Suite -->
    <path d="M960,480 L1400,680 L1580,680" />
  </g>

  <!-- Central Access Point Node -->
  <circle cx="960" cy="480" r="36" fill="#12161f" stroke="#00d2ff" stroke-width="3" filter="url(#neonGlow)" />
  <circle cx="960" cy="480" r="14" fill="#ff3b30" filter="url(#neonGlow)" />
  
  <!-- Wi-Fi 7 Central Label -->
  <rect x="880" y="535" width="160" height="34" rx="17" fill="rgba(0, 210, 255, 0.15)" stroke="#00d2ff" stroke-width="1.5" />
  <text x="960" y="557" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" letter-spacing="1.5" text-anchor="middle">WI-FI 7 AP</text>

  <!-- Connected Property Nodes (Glassmorphism Cards) -->
  
  <!-- Node 1: Living Room & 4K AV -->
  <g transform="translate(240, 260)">
    <rect width="260" height="110" rx="12" fill="url(#glassCard)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
    <circle cx="45" cy="55" r="22" fill="rgba(255, 59, 48, 0.2)" stroke="#ff3b30" stroke-width="2" />
    <text x="45" y="61" fill="#ff3b30" font-family="sans-serif" font-size="16" text-anchor="middle">📺</text>
    <text x="85" y="48" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">Living Room 4K HDR</text>
    <text x="85" y="72" fill="#8e8e93" font-family="sans-serif" font-size="13">10 Gbps Cat6a Hardwired</text>
  </g>

  <!-- Node 2: Boathouse & Waterfront Dock -->
  <g transform="translate(1420, 260)">
    <rect width="260" height="110" rx="12" fill="url(#glassCard)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
    <circle cx="45" cy="55" r="22" fill="rgba(0, 210, 255, 0.2)" stroke="#00d2ff" stroke-width="2" />
    <text x="45" y="61" fill="#00d2ff" font-family="sans-serif" font-size="16" text-anchor="middle">⚓</text>
    <text x="85" y="48" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">Boathouse &amp; Dock</text>
    <text x="85" y="72" fill="#8e8e93" font-family="sans-serif" font-size="13">Weatherproof Outdoor AP</text>
  </g>

  <!-- Node 3: Control4 Smart Automation Rack -->
  <g transform="translate(830, 780)">
    <rect width="260" height="110" rx="12" fill="url(#glassCard)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
    <circle cx="45" cy="55" r="22" fill="rgba(52, 199, 89, 0.2)" stroke="#34c759" stroke-width="2" />
    <text x="45" y="61" fill="#34c759" font-family="sans-serif" font-size="16" text-anchor="middle">⚙️</text>
    <text x="85" y="48" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">Central AV Rack</text>
    <text x="85" y="72" fill="#8e8e93" font-family="sans-serif" font-size="13">Control4 &amp; Isolated VLAN</text>
  </g>

  <!-- Node 4: Outdoor Pool Terrace -->
  <g transform="translate(220, 620)">
    <rect width="260" height="110" rx="12" fill="url(#glassCard)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
    <circle cx="45" cy="55" r="22" fill="rgba(255, 149, 0, 0.2)" stroke="#ff9500" stroke-width="2" />
    <text x="45" y="61" fill="#ff9500" font-family="sans-serif" font-size="16" text-anchor="middle">🏊</text>
    <text x="85" y="48" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">Pool Terrace Audio</text>
    <text x="85" y="72" fill="#8e8e93" font-family="sans-serif" font-size="13">All-Weather Speakers</text>
  </g>

  <!-- Node 5: Master Suite Smart Keypads -->
  <g transform="translate(1440, 620)">
    <rect width="260" height="110" rx="12" fill="url(#glassCard)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
    <circle cx="45" cy="55" r="22" fill="rgba(175, 82, 222, 0.2)" stroke="#af52de" stroke-width="2" />
    <text x="45" y="61" fill="#af52de" font-family="sans-serif" font-size="16" text-anchor="middle">💡</text>
    <text x="85" y="48" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">Master Suite</text>
    <text x="85" y="72" fill="#8e8e93" font-family="sans-serif" font-size="13">Lutron Lighting Subnet</text>
  </g>

  <!-- Top Hero Title Overlay Banner -->
  <g transform="translate(960, 100)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" letter-spacing="4" text-anchor="middle">RESIDENTIAL ENTERPRISE NETWORK</text>
    <text x="0" y="32" fill="#00d2ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="3" text-anchor="middle">DAVIDSON SMART SOLUTIONS CERTIFIED ARCHITECTURE</text>
  </g>
</svg>
