backend:
  name: github
  repo: AnatoliHS/WEB-DAVIDSON-SMART-SOLUTIONS
  branch: main
  base_url: https://davidsonsmartsolutions.com
  # Only needed if you host your own OAuth handler rather than using a
  # provider's. Must return a GitHub token to the CMS.
  auth_endpoint: /api/auth

# Lets `npx decap-server` write to your working copy instead of GitHub,
# so local edits never touch the live repo.
local_backend: true

media_folder: "src/assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  # ---------------------------------------------------------------
  # Global data. Each file becomes one form. Eleventy exposes
  # src/_data/site.yaml to templates as `site`.
  # ---------------------------------------------------------------
  - name: settings
    label: "Site Settings"
    files:
      - file: "src/_data/site.yaml"
        label: "Site"
        name: site_yaml
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - { label: "URL", name: "url", widget: "string", required: false }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Address", name: "address", widget: "string" }
          - label: "Key Stats"
            name: "stats"
            widget: "object"
            fields:
              - { label: "Homes Automated", name: "homes_automated", widget: "string" }
              - { label: "Certified Electricians %", name: "electrician_certified", widget: "string" }
              - { label: "Brand Partners", name: "brand_partners", widget: "string" }
              - { label: "Google Rating", name: "google_rating", widget: "string" }

      - file: "src/_data/navigation.yaml"
        label: "Navigation"
        name: navigation_yaml
        fields:
          # A `list` of `object` is the repeatable-row pattern. `summary`
          # controls the collapsed label for each row.
          - label: Main
            name: main
            widget: list
            summary: "{{title}} — {{href}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Href, name: href, widget: string }

  # ---------------------------------------------------------------
  # Content. One markdown file per entry.
  # ---------------------------------------------------------------
  - name: "blog"
    label: "Blog Posts"
    folder: "src/blog"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "yaml-frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Body Content", name: "body", widget: "markdown" }

